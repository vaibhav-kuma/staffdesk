name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Install JavaFX runtime libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libasound2t64
      - name: Unit, PostgreSQL Testcontainers integration, JavaFX tests and format
        run: xvfb-run -a ./mvnw -B verify spotless:check
        env: {RUN_FX_TESTS: 'true'}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
            desktop/target/screenshots/*
      - name: Generate SBOM
        run: ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DskipTests
      - uses: actions/upload-artifact@v4
        with: {name: sbom, path: target/bom.json}
  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Install JavaFX test libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libasound2t64
      - uses: docker/setup-buildx-action@v3
      - name: Validate configuration
        env:
          DB_USER: validation
          DB_PASSWORD: validation-only
          JWT_SECRET: validation-only
        run: docker compose config --quiet
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: staffdesk-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability gate (OS + Java)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: staffdesk-api:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: false
      - name: Compose integration smoke
        run: |
          export DB_USER=ci DB_PASSWORD="$(openssl rand -hex 24)" JWT_SECRET="$(openssl rand -base64 48)"
          export BOOTSTRAP_ADMIN_EMAIL=ci@example.test BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 20)"
          docker tag staffdesk-api:ci staffdesk-api:local
          docker compose up --no-build -d --wait --wait-timeout 180
          API_URL=http://127.0.0.1:8080 ALLOW_LOCAL_HTTP=true SMOKE_EMAIL="$BOOTSTRAP_ADMIN_EMAIL" SMOKE_PASSWORD="$BOOTSTRAP_ADMIN_PASSWORD" python3 scripts/smoke-api.py
          RUN_FX_TESTS=true FX_E2E_URL=http://127.0.0.1:8080 FX_E2E_EMAIL="$BOOTSTRAP_ADMIN_EMAIL" FX_E2E_PASSWORD="$BOOTSTRAP_ADMIN_PASSWORD" xvfb-run -a ./mvnw -B -pl desktop -am test
          docker compose down -v
  native-packages:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Build native dependency set
        shell: bash
        run: ./mvnw -B -pl desktop -am package -DskipTests
      - name: Package portable native application
        if: runner.os != 'Windows'
        run: bash scripts/package-desktop.sh app-image
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-desktop.ps1 app-image
      - name: Archive macOS application (preserve modes/symlinks)
        if: runner.os == 'macOS'
        run: tar -czf Staffdesk-macOS.tar.gz -C artifacts Staffdesk.app
      - name: Archive Linux application (preserve modes/symlinks)
        if: runner.os == 'Linux'
        run: tar -czf Staffdesk-Linux.tar.gz -C artifacts Staffdesk
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path artifacts/Staffdesk -DestinationPath Staffdesk-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Staffdesk-${{ runner.os }}
          path: |
            Staffdesk-*.tar.gz
            Staffdesk-*.zip
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: [verify, container, native-packages]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify exact tested revision
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          python3 scripts/deploy-render.py
          python3 scripts/smoke-api.py
