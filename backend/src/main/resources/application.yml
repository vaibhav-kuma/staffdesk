spring:
  application:
    name: staffdesk
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/staffdesk}
    username: ${DB_USER:staffdesk}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 16KB
    max-swallow-size: 16KB
    threads:
      max: 100
  max-http-request-header-size: 16KB
management:
  metrics:
    tags:
      application: staffdesk
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
app:
  jwt-secret: ${JWT_SECRET}
  jwt-issuer: ${JWT_ISSUER:staffdesk-api}
  jwt-audience: staffdesk-desktop
  token-minutes: ${TOKEN_MINUTES:15}
  bootstrap-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
