# Optional only. Prefer provider-native monitoring until a dedicated metrics identity exists.
# Protect this entire Prometheus host and file permissions; never expose management tokens publicly.
scrape_configs:
  - job_name: staffdesk
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [YOUR_VERIFIED_API_HOST]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/short_lived_admin_jwt
rule_files: [alerts.yml]
